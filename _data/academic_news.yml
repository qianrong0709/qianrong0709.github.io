      date_label: August 17–21, 2025
      title: ACS Fall 2025
      location: Washington, D.C., USA
      summary: >-
        I attended the American Chemical Society’s fall meeting in Washington, D.C., and presented “Structure-function dual-driven molecular generation for targeted drug discovery” on August 19 (Poster Board #405).
    zh:
