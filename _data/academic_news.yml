entries:
  - id: pocketgpt-publication
    date: '2026-07-15'
    en:
      date_label: July 2026
      title: PocketGPT published in The Innovation Drug Discovery
      summary: Our PocketGPT study on structure–function conditioned molecular generation and prospective discovery of PARP1 inhibitors was published in <em>The Innovation Drug Discovery</em>.
    zh:
      date_label: 2026 年 7 月
      title: PocketGPT 研究发表
      summary: 我们的 PocketGPT 研究已发表于 <em>The Innovation Drug Discovery</em>，围绕结构–功能条件分子生成，通过前瞻性实验发现了 PARP1 抑制剂。
    source: https://doi.org/10.59717/j.xinn-drugdisc.2026.100028
    source_label: publication_source

  - id: accp-2026
    date: '2026-07-09'
    en:
      date_label: July 9–11, 2026
      title: ACCP 2026 in Bangkok
      location: Bangkok, Thailand
      summary: I attended the 25th Asian Conference on Clinical Pharmacy in Bangkok. I presented a poster on using PocketGPT, a pocket-guided molecular design framework, to prospectively discover a nanomolar PARP1 inhibitor.
    zh:
      date_label: 2026 年 7 月 9–11 日
      title: 参加曼谷 ACCP 2026
      location: 泰国曼谷
      summary: 我在泰国曼谷参加了第 25 届亚洲临床药学大会（ACCP 2026）。我在会上展示了 PocketGPT 研究海报，介绍如何利用蛋白口袋引导分子设计，并前瞻性发现纳摩尔级 PARP1 抑制剂。
    source: https://accp2026bangkok.pharmacycouncil.org/en
    source_label: conference_source
