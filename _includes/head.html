{% include base_path %}
{% include language-context.html %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>


<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v={{ site.time | date: '%s' }}">

{% if page.translation_key %}
<link rel="alternate" hreflang="{{ ui.html_lang }}" href="{{ page.url | absolute_url }}">
{% if alternate_page %}<link rel="alternate" hreflang="{{ site.data.i18n[other_lang].html_lang }}" href="{{ alternate_page.url | absolute_url }}">{% endif %}
{% endif %}
<script defer src="{{ '/assets/js/language.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
{% if page.translation_key == 'blog' %}<script defer src="{{ '/assets/js/blog.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>{% endif %}
